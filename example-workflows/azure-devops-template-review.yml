name: Augment Agent - Azure DevOps Template-Based Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  azure-devops-template-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create template directory
        run: |
          mkdir -p .github/templates

      - name: Create Azure DevOps PR review template
        run: |
          cat > .github/templates/azure-devops-pr-review.njk << 'EOF'
          Please review Azure DevOps pull request #{{ pr.pullRequestId }}: "{{ pr.title }}"

          **Author:** {{ pr.author }}
          **Branch:** {{ pr.sourceRef.ref }} → {{ pr.targetRef.ref }}
          **Organization:** {{ pr.sourceRef.repo.organization }}
          **Project:** {{ pr.sourceRef.repo.project }}
          **Repository:** {{ pr.sourceRef.repo.repository }}

          {% if pr.description %}
          **Description:**
          {{ pr.description }}
          {% endif %}

          **Changed Files ({{ pr.changed_files_list | length }} total):**
          {% for file in pr.changed_files_list %}
          - {{ file.path }} ({{ file.gitObjectType }})
          {% endfor %}

          {% if pr.changed_files_list | length > 15 %}
          ⚠️ This is a large PR with {{ pr.changed_files_list | length }} files changed. Please pay special attention to the scope and impact.
          {% endif %}

          {% set has_tests = pr.changed_files | includes("test") or pr.changed_files | includes("spec") %}
          {% if not has_tests %}
          ⚠️ No test files detected in this PR. Please verify that appropriate tests have been added or updated.
          {% endif %}

          **Reviewers:**
          {% for reviewer in pr.reviewers %}
          - {{ reviewer.displayName }} (Vote: {{ reviewer.vote }}, Required: {{ reviewer.isRequired }})
          {% endfor %}

          **Code Changes:**
          ```diff
          {{ pr.diff_file | maybe_read_file }}
          ```

          **Review Focus:**
          Please provide a thorough code review covering:

          1. **Code Quality**: Check for adherence to coding standards and best practices
          2. **Security**: Look for potential security vulnerabilities or concerns
          3. **Performance**: Assess any performance implications of the changes
          4. **Maintainability**: Evaluate code readability and maintainability
          5. **Testing**: Verify adequate test coverage for new functionality
          6. **Documentation**: Check if documentation updates are needed
          7. **Azure DevOps Integration**: Ensure proper integration with Azure DevOps workflows

          {% if custom.priority %}
          **Priority Level:** {{ custom.priority | upper }}
          {% if custom.priority == "high" %}
          🚨 This is a high-priority PR requiring urgent review and approval.
          {% endif %}
          {% endif %}

          {% if custom.reviewers %}
          **Suggested Reviewers:** {{ custom.reviewers | join(", ") }}
          {% endif %}

          Please provide specific, actionable feedback with file and line references where applicable.
          Focus on the actual code changes and their impact on the codebase.

          After your review, please post your feedback as a comment on this Azure DevOps pull request.
          EOF

      - name: Azure DevOps Template-Based Code Review
        uses: augmentcode/augment-agent@v0
        with:
          augment_session_auth: ${{ secrets.AUGMENT_SESSION_AUTH }}
          platform: "azure-devops"
          azure_devops_token: ${{ secrets.AZURE_DEVOPS_TOKEN }}
          azure_devops_organization: ${{ vars.AZURE_DEVOPS_ORGANIZATION }}
          azure_devops_project: ${{ vars.AZURE_DEVOPS_PROJECT }}
          azure_devops_repository: ${{ vars.AZURE_DEVOPS_REPOSITORY }}
          azure_devops_pull_request_id: ${{ github.event.pull_request.number }}
          template_directory: ".github/templates"
          template_name: "azure-devops-pr-review.njk"
          custom_context: |
            {
              "priority": "normal",
              "reviewers": ["team-lead", "senior-dev"],
              "focus_areas": ["security", "performance", "azure-devops-integration"]
            }
