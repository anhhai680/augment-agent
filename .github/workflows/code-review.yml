name: Auto-review PRs
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create instruction file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.CODEREVIEW_GITHUB_TOKEN }}
        run: |
          # Get the list of changed files for the LLM to reference
          CHANGED_FILES=$(gh pr diff $PR_NUMBER --name-only)
          
          cat > /tmp/openai-review-instruction.txt << EOF
          Perform a comprehensive code review of the following pull request using OpenAI GPT-4:

          **Pull Request Information:**
          - PR Number: ${PR_NUMBER}
          - Repository: ${REPOSITORY}
          - Base Branch: ${BASE_BRANCH}
          - Head Branch: ${HEAD_BRANCH}

          **Changed Files in this PR:**
          $CHANGED_FILES

          **Review Focus:**
          Analyze the modified files and provide detailed feedback on:
          - Code quality and adherence to best practices
          - Potential bugs, errors, or security vulnerabilities
          - Performance implications of the changes
          - Suggestions for improvement or optimization
          - Any missing error handling or edge cases
          - Code maintainability and readability
          - OpenAI-specific considerations (AI safety, bias, etc.)

          **Output Format:**
          Write your review in natural, human-friendly language first, then add the structured data.

          **Example Format:**
          ```
          ## Code Review Summary
          
          I've reviewed the pull request and found several areas for improvement. Overall, the changes look good but there are some performance and maintainability concerns that should be addressed.

          ### Key Findings
          - Line 5 in `.github/workflows/code-review.yml` needs better documentation
          - Line 23 in `src/services/github-service.ts` requires proper error handling
          - Line 15 in `src/services/llm/llm-factory.ts` could benefit from type validation

          ### Recommendations
          Please address these inline comments for better code quality and maintainability.

          ```json
          {
            "summary": "Brief summary for metadata",
            "line_comments": [
              {
                "file": ".github/workflows/code-review.yml",
                "line": 5,
                "comment": "Consider adding comments to explain the purpose of each job and step for better readability",
                "side": "RIGHT"
              },
              {
                "file": "src/services/github-service.ts",
                "line": 23,
                "comment": "Ensure that any API calls made here have proper error handling to manage failed requests gracefully",
                "side": "RIGHT"
              },
              {
                "file": "src/services/llm/llm-factory.ts",
                "line": 15,
                "comment": "The factory pattern is well implemented, but consider adding type checks or validations to ensure robustness",
                "side": "RIGHT"
              }
            ]
          }
          ```
          ```

          **IMPORTANT REQUIREMENTS:**
          - Write your review in natural, human-friendly language first
          - Add the JSON section at the end for inline comment functionality  
          - Use EXACT file paths from the "Changed Files" list above
          - Use specific line numbers from the actual changes (examine the diff)
          - Include "side": "RIGHT" for new/modified lines
          - The JSON is for technical purposes only - users will see your natural language review 
          - Put each piece of feedback as a separate object in line_comments array
          - Each line_comment must have: file, line, comment, and side fields
          - Keep summary brief (1-2 sentences)
          - Focus on the actual code changes and their impact on the codebase
          EOF

      - name: Generate PR Review
        uses: ./
        with:
          llm_provider: "openai"
          llm_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o-mini"
          llm_temperature: "0.3"
          llm_max_tokens: "4000"
          post_comment: "true"
          comment_type: "review"
          review_event: "COMMENT"
          use_inline_comments: "true"
          inline_comment_strategy: "review_with_comments"
          pull_number: ${{ github.event.pull_request.number }}
          repo_name: ${{ github.repository }}
          github_token: ${{ secrets.CODEREVIEW_GITHUB_TOKEN }}
          instruction_file: /tmp/openai-review-instruction.txt
